name: Build Manager

on:
  push:
    tags: [ "v*" ]
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'ethd/**'
      - 'ethinit/**'
      - 'ethsu/**'
      - 'kmod/**'
      - 'ramtool/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.gitattributes'
      - '.gitignore'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'version.properties'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'ethd/**'
      - 'ethinit/**'
      - 'ethsu/**'
      - 'kmod/**'
      - 'ramtool/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.gitattributes'
      - '.gitignore'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'version.properties'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.1.0
            ndk;29.0.14206865
            cmake;3.31.6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils kmod
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-linux-android
          rustup default 1.98.0
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            ethd
            ramtool
          cache-targets: false

      - name: Build with Gradle
        run: |
          bash tests/check-no-legacy-branding.sh
          bash tests/run-ethinit-kmi-test.sh
          bash kmod/verify-module-crc.sh --self-test
          bash kmod/verify-prebuilt.sh
          cargo test --manifest-path ramtool/Cargo.toml --locked
          cargo test --manifest-path ethd/Cargo.toml --locked
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"
          ./gradlew --no-configuration-cache --stacktrace clean testDebugUnitTest lintDebug assembleDebug assembleRelease
          mapfile -t RELEASE_APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#RELEASE_APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#RELEASE_APKS[@]}"
            exit 1
          fi
          bash tests/check-release-artifacts.sh "${RELEASE_APKS[0]}"
          echo "BUILD_TOOL_VERSION=36.1.0" >> "$GITHUB_ENV"

      - name: Upload mappings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "mappings"
          path: "app/build/outputs/mapping/release/"
          if-no-files-found: error

      - name: Upload unsigned release APK for signing
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ethereal-Unsigned-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload CI release APK
        if: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ethereal-Release-CI
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload CI debug APK
        if: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ethereal-Debug-CI
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  signing:
    name: Sign tagged release APK
    needs: build-manager
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "build-tools;36.1.0"
          test -x "$ANDROID_HOME/build-tools/36.1.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"

      - name: Download unsigned release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Ethereal-Unsigned-Release
          path: unsigned/release

      # The release key has one job. Debug builds keep their own identity.
      - name: Sign and verify v2-only release APK
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${SIGNING_KEY:?SIGNING_KEY is required}"
          : "${KEY_STORE_PASSWORD:?KEY_STORE_PASSWORD is required}"
          : "${KEY_ALIAS:?ALIAS is required}"
          : "${KEY_PASSWORD:?KEY_PASSWORD is required}"

          build_tools="$ANDROID_HOME/build-tools/36.1.0"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          keystore="$RUNNER_TEMP/ethereal-release-signing.jks"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          unset SIGNING_KEY
          mkdir -p signed/release

          mapfile -t release_apks < <(find unsigned/release -type f -name '*.apk' -print)
          [[ "${#release_apks[@]}" -eq 1 ]]
          input="${release_apks[0]}"
          aligned="$RUNNER_TEMP/ethereal-release-aligned.apk"
          output="signed/release/$(basename "${input%.apk}")-signed.apk"
          "$zipalign" -p -f 4 "$input" "$aligned"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$output" \
            "$aligned"

          verify_output=$("$apksigner" verify --verbose --print-certs "$output" 2>&1)
          grep -q "Verified using v1 scheme.*: false" <<< "$verify_output"
          grep -q "Verified using v2 scheme.*: true" <<< "$verify_output"
          grep -q "Verified using v3 scheme.*: false" <<< "$verify_output"
          grep -q "Verified using v3.1 scheme.*: false" <<< "$verify_output"
          grep -q "Verified using v4 scheme.*: false" <<< "$verify_output"
          grep -q "Number of signers: 1" <<< "$verify_output"
          grep -Fq "Signer #1 certificate SHA-256 digest: 77ac5f3d8e7ac1ceef2514b4428015a482fde0a76e09762c92b865c1203878f8" <<< "$verify_output"

      - name: Upload signed release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ethereal-Release
          path: signed/release/*.apk
          if-no-files-found: error

  release:
    name: Publish tagged release
    needs: signing
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Ethereal-Release
          path: release-apk

      - name: Release APK
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          artifacts: release-apk/*.apk
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
